    <!-- Applies a stored theme choice BEFORE first paint. Without this the
         dark defaults in :root would flash for one frame on a light load.
         Deliberately inline and synchronous — a module script would run too
         late. If nothing is stored we leave data-theme off entirely so the
         prefers-color-scheme block in index.css stays in charge. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) { /* private mode / storage disabled — fall back to the OS */ }
      })();
    </script>
</head>

</body>
